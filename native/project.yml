# Production project: FSPathURLResource requires the real macOS 26 SDK.
include:
  - project-base.yml
targets:
  RepoReach:
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) REPOREACH_NATIVE_FSKIT'
    dependencies:
      - target: RepoReachFSKit
        embed: true
  RepoReachFSKit:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - path: FSKitExtension
        excludes:
          - README.md
          - '*.entitlements'
      - path: Shared/FSBridgeContainer.swift
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: '26.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.enoughtools.reporeach.fskit
        PRODUCT_NAME: RepoReachFSKit
        INFOPLIST_FILE: FSKitExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: FSKitExtension/FSKit.entitlements
    dependencies:
      - sdk: FSKit.framework
      - sdk: ExtensionFoundation.framework
schemes:
  RepoReachFSKit:
    build:
      targets:
        RepoReach: all
        RepoReachFinder: all
        RepoReachFSKit: all
    test:
      targets:
        - RepoReachTests
