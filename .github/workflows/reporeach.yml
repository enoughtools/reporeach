name: RepoReach

on:
  pull_request:
  push:
    branches: [main]
    tags: ["reporeach-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 0.1.0-beta.3
      publish:
        description: Reserved; releases are disabled during native FSKit validation
        type: boolean
        default: false
      validation_artifacts:
        description: Export unsigned FSKit test apps and a read-only module inspector; never publish a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reporeach-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.8
      - run: python3 scripts/test-fskit-packaging.py
      - run: python3 scripts/test-local-fskit-signing.py
      - run: go build ./cmd/artifact-fs
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/gitstore ./internal/hydrator ./internal/daemon ./internal/fusefs ./internal/overlay ./internal/catalogfs ./internal/desktop ./internal/fsbridge

  filesystem:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.8
      - name: Prepare disposable runner's FUSE device
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes fuse3
          test -c /dev/fuse || sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      - run: scripts/fuse-e2e.sh
      - name: Mounted concurrent directory rename stress
        env:
          AFS_RUN_E2E_TESTS: "1"
        run: go test -count=10 -run '^TestE2EFilesystemDirectoryRenameConcurrentAccess$' -timeout=3m -v .

  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run format:check --prefix site
      - run: npm run build --prefix site
      - name: Production release download regression
        run: python3 scripts/test-website-release.py

  macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.8
      - name: Compile legacy management app for source validation
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: scripts/build-macos.sh --backend macfuse --compile-only --arch "$ARCHITECTURE" --unsigned
      - name: FSKit acceptance module selection regressions
        if: matrix.architecture == 'arm64'
        # Pure selection validation; no installed module, confirmation or mount.
        run: go test -run '^(TestSelectedFSKitModuleIdentifier|TestFSKitInstalledInspectionEvidence|TestFSKitAcceptanceSigningIdentity|TestFSKitAcceptanceGroupClaims|TestFSKitContainerResolution|TestFSKitAcceptanceModuleClaims|TestFSKitContainerDirectory|TestFSKitAcceptanceDaemonProcessGroup|TestFSKitAcceptanceSourceIdentity)$' -count=1 .
      - name: Native unit tests
        run: |
          xcodebuild -project native/RepoReach.xcodeproj -scheme RepoReach \
            -configuration Debug -derivedDataPath build/native-tests \
            -destination 'platform=macOS' ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Native client and real engine control smoke
        if: matrix.architecture == 'arm64'
        run: |
          mkdir -p build/control-smoke
          CGO_ENABLED=0 go build -trimpath -o build/control-smoke/artifact-fs ./cmd/artifact-fs
          swiftc -parse-as-library native/App/Models.swift native/App/EngineClient.swift \
            native/Tools/control-smoke.swift -o build/control-smoke/check
          build/control-smoke/check "$PWD/build/control-smoke/artifact-fs"

      - name: Real Go filesystem bridge and Swift extension client interop
        if: matrix.architecture == 'arm64'
        run: |
          mkdir -p build/fsbridge-smoke
          swiftc -parse-as-library native/Shared/FSBridgeContainer.swift \
            native/FSKitExtension/BridgeConfiguration.swift \
            native/FSKitExtension/BridgeModels.swift native/FSKitExtension/BridgeTransport.swift \
            native/FSKitExtension/BridgeClient.swift native/Tools/fsbridge-smoke.swift \
            -o build/fsbridge-smoke/check
          AFS_NATIVE_BRIDGE_CLIENT="$PWD/build/fsbridge-smoke/check" \
            go test -count=1 -run '^TestNativeClientInterop$' -v ./internal/fsbridge
      - name: Production FSVolume callbacks against the real Go bridge
        if: matrix.architecture == 'arm64'
        # Callback integration; installed mount/read buffers/directory packers remain a separate gate.
        run: |
          mkdir -p build/fsbridge-smoke
          xcrun swiftc -parse-as-library -target arm64-apple-macos15.4 \
            native/Shared/FSBridgeContainer.swift \
            native/FSKitExtension/BridgeModels.swift native/FSKitExtension/BridgeConfiguration.swift \
            native/FSKitExtension/BridgeTransport.swift native/FSKitExtension/BridgeClient.swift \
            native/FSKitExtension/RepoReachVolume.swift native/Tools/fsbridge-volume-smoke.swift \
            -o build/fsbridge-smoke/volume-check
          REPOREACH_FSBRIDGE_NATIVE_CLIENT="$PWD/build/fsbridge-smoke/volume-check" \
            GOTOOLCHAIN=go1.26.8 go test -count=1 -run '^TestNativeFSKitBridgeClient$' -v ./internal/fsbridge

  fskit26:
    # Official runner inventory: actions/runner-images/images/macos/macos-26-arm64-Readme.md.
    # Compile validation does not establish signed extension activation or a real mount.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.8
      - name: Verify macOS 26 and selected Xcode 26.6
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          test "$(xcodebuild -version | awk '/^Xcode / {print $2}')" = 26.6
      - name: Compile and test standalone FSKit module inspector
        if: matrix.architecture == 'arm64'
        # A read-only diagnostic, kept outside every app and release package.
        run: |
          set -euo pipefail
          stage=build/fskit-validation/inspector-build/arm64
          output=build/fskit-validation/inspector/arm64
          mkdir -p "$stage" "$output"
          xcrun swiftc -warnings-as-errors -parse-as-library -target arm64-apple-macos26.0 \
            native/Tools/inspect-fskit-module.swift -o "$stage/inspect-fskit-module"
          "$stage/inspect-fskit-module" --self-test
          test "$(xcrun lipo -archs "$stage/inspect-fskit-module")" = arm64
          python3 scripts/release-manifest.py source --output "$stage/source.json"
          ditto -c -k --sequesterRsrc "$stage/inspect-fskit-module" "$output/inspect-fskit-module.zip"
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          stage = pathlib.Path("build/fskit-validation/inspector-build/arm64")
          output = pathlib.Path("build/fskit-validation/inspector/arm64")
          source = json.loads((stage / "source.json").read_text())
          if source["dirty"]:
              raise SystemExit("Inspector artifacts require a clean committed source checkout")
          def record(path):
              return {"filename": path.name, "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          def tool(*arguments):
              return subprocess.check_output(arguments, text=True).strip()
          executable = record(stage / "inspect-fskit-module")
          artifact = record(output / "inspect-fskit-module.zip")
          metadata = {
              "purpose": "read-only-fskit-module-inspection", "distribution": False,
              "source": source, "architecture": "arm64", "minimumMacOS": "26.0",
              "inspectorSourceSha256": record(pathlib.Path("native/Tools/inspect-fskit-module.swift"))["sha256"],
              "toolchain": {"xcode": tool("xcodebuild", "-version"),
                            "macOSSDK": tool("xcrun", "--sdk", "macosx", "--show-sdk-version")},
              "executable": executable, "artifact": artifact,
          }
          (output / "inspect-fskit-module.json").write_text(json.dumps(metadata, indent=2) + "\n")
          (output / "SHA256SUMS").write_text(f"{artifact['sha256']}  {artifact['filename']}\n")
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.architecture == 'arm64' && github.event_name == 'workflow_dispatch' && inputs.validation_artifacts && success()
        with:
          name: fskit-module-inspector-arm64
          path: build/fskit-validation/inspector/arm64/
          if-no-files-found: error
          retention-days: 7
      - name: FSKit distribution authorization regression checks
        run: python3 scripts/test-fskit-packaging.py
      - name: FSKit acceptance module selection regressions
        if: matrix.architecture == 'arm64'
        # Keep the root Darwin tests covered on both supported CI OS versions.
        run: go test -run '^(TestSelectedFSKitModuleIdentifier|TestFSKitInstalledInspectionEvidence|TestFSKitAcceptanceSigningIdentity|TestFSKitAcceptanceGroupClaims|TestFSKitContainerResolution|TestFSKitAcceptanceModuleClaims|TestFSKitContainerDirectory|TestFSKitAcceptanceDaemonProcessGroup|TestFSKitAcceptanceSourceIdentity)$' -count=1 .
      - name: Compile bundled FSKit app and check ExtensionKit layout
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          EXPORT_VALIDATION_ARTIFACTS: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_artifacts }}
        run: |
          set -euo pipefail
          mkdir -p build/fskit-validation
          options=(--compile-only)
          if [ "$EXPORT_VALIDATION_ARTIFACTS" = true ]; then options=(--validation-artifact); fi
          scripts/build-macos.sh --backend fskit "${options[@]}" --arch "$ARCHITECTURE" --unsigned \
            > "build/fskit-validation/compile-$ARCHITECTURE.log" 2>&1 || {
              tail -n 120 "build/fskit-validation/compile-$ARCHITECTURE.log"
              exit 1
            }
          tail -n 12 "build/fskit-validation/compile-$ARCHITECTURE.log"
          test ! -d dist/releases
      - name: FSKit and native unit tests
        if: matrix.architecture == 'arm64'
        run: |
          xcodebuild -project native/RepoReach.xcodeproj -scheme RepoReachFSKit \
            -configuration Debug -derivedDataPath build/native-fskit-tests \
            -destination 'platform=macOS' ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Real Go filesystem bridge and Swift extension client interop
        if: matrix.architecture == 'arm64'
        run: |
          mkdir -p build/fsbridge-smoke
          swiftc -parse-as-library native/Shared/FSBridgeContainer.swift \
            native/FSKitExtension/BridgeConfiguration.swift \
            native/FSKitExtension/BridgeModels.swift native/FSKitExtension/BridgeTransport.swift \
            native/FSKitExtension/BridgeClient.swift native/Tools/fsbridge-smoke.swift \
            -o build/fsbridge-smoke/check
          AFS_NATIVE_BRIDGE_CLIENT="$PWD/build/fsbridge-smoke/check" \
            go test -count=1 -run '^TestNativeClientInterop$' -v ./internal/fsbridge
      - name: Production FSVolume callbacks against the real Go bridge
        if: matrix.architecture == 'arm64'
        # Callback integration; installed mount/read buffers/directory packers remain a separate gate.
        run: |
          mkdir -p build/fsbridge-smoke
          xcrun swiftc -parse-as-library -target arm64-apple-macos15.4 \
            native/Shared/FSBridgeContainer.swift \
            native/FSKitExtension/BridgeModels.swift native/FSKitExtension/BridgeConfiguration.swift \
            native/FSKitExtension/BridgeTransport.swift native/FSKitExtension/BridgeClient.swift \
            native/FSKitExtension/RepoReachVolume.swift native/Tools/fsbridge-volume-smoke.swift \
            -o build/fsbridge-smoke/volume-check
          REPOREACH_FSBRIDGE_NATIVE_CLIENT="$PWD/build/fsbridge-smoke/volume-check" \
            GOTOOLCHAIN=go1.26.8 go test -count=1 -run '^TestNativeFSKitBridgeClient$' -v ./internal/fsbridge

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'workflow_dispatch' && inputs.validation_artifacts && success()
        with:
          name: fskit-local-validation-${{ matrix.architecture }}
          path: build/fskit-validation/products/${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: fskit26-compile-validation-${{ matrix.architecture }}
          path: build/fskit-validation/*.log
          retention-days: 14

  release:
    # New FSKit releases remain disabled until signed extension activation and
    # mounted behavior pass on macOS 26 with an actual authorized profile.
    if: ${{ false }}
    needs: [engine, filesystem, website, macos, fskit26]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: macos-*
          path: dist/release
          merge-multiple: true
      - name: Publish verified architecture archives
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF#refs/tags/reporeach-v}}"
          case "$version" in *[!A-Za-z0-9.+-]*|"") exit 2 ;; esac
          tag="reporeach-v$version"
          remote_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            tagged_commit="$(git rev-parse "$tag^{commit}")"
            test "$tagged_commit" = "$(git rev-parse HEAD)" || {
              echo "Existing tag points to a different source commit; refusing to publish these artifacts." >&2
              exit 1
            }
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            test -n "$remote_tag" || {
              echo "Existing release has no verifiable source tag; refusing to change it." >&2
              exit 1
            }
            echo "An existing release for this exact source is preserved without changing its artifacts."
            exit 0
          fi
          python3 scripts/release-manifest.py manifest --directory dist/release --version "$version"
          options=()
          case "$version" in *-*) options+=(--prerelease) ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "RepoReach $version" --generate-notes "${options[@]}" \
            dist/release/*.dmg dist/release/*.zip dist/release/SHA256SUMS dist/release/release.json
