name: RepoReach

on:
  pull_request:
  push:
    branches: [main]
    tags: ["reporeach-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 0.1.0-beta.1
      publish:
        description: Publish a GitHub release after checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reporeach-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.8
      - run: go build ./cmd/artifact-fs
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/gitstore ./internal/daemon ./internal/fusefs ./internal/overlay ./internal/catalogfs ./internal/desktop

  filesystem:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.8
      - name: Prepare disposable runner's FUSE device
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes fuse3
          test -c /dev/fuse || sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      - run: scripts/fuse-e2e.sh
      - name: Mounted concurrent directory rename stress
        env:
          AFS_RUN_E2E_TESTS: "1"
        run: go test -count=10 -run '^TestE2EFilesystemDirectoryRenameConcurrentAccess$' -timeout=3m -v .

  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run format:check --prefix site
      - run: npm run build --prefix site

  macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    env:
      MACOS_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.8
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-0.1.0-beta.1}"
          if [[ "$GITHUB_REF" == refs/tags/reporeach-v* ]]; then version="${GITHUB_REF#refs/tags/reporeach-v}"; fi
          case "$version" in *[!A-Za-z0-9.+-]*|"") exit 2 ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Import optional signing identity
        if: github.event_name != 'pull_request' && env.MACOS_DEVELOPER_ID_CERTIFICATE != ''
        run: |
          set -euo pipefail
          signing_keychain="$RUNNER_TEMP/reporeach-signing.keychain-db"
          signing_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$signing_keychain" \
            -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$signing_keychain" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$signing_keychain"
          identity="$(security find-identity -v -p codesigning "$signing_keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$identity"
          echo "REPOREACH_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/developer-id.p12"
      - name: Package app, engine, official GitHub CLI, and Finder extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          options=(--arch "$ARCHITECTURE" --version "$VERSION")
          if [ -n "${REPOREACH_SIGN_IDENTITY:-}" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$APPLE_API_KEY_PATH"
            chmod 600 "$APPLE_API_KEY_PATH"
            options+=(--notarize)
          fi
          scripts/build-macos.sh "${options[@]}"
          python3 scripts/release-manifest.py manifest --directory "dist/releases/$VERSION" --version "$VERSION"
      - name: Native unit tests
        run: |
          xcodebuild -project native/RepoReach.xcodeproj -scheme RepoReach \
            -configuration Debug -derivedDataPath build/native-tests \
            -destination 'platform=macOS' ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Native client and real engine control smoke
        if: matrix.architecture == 'arm64'
        run: |
          mkdir -p build/control-smoke
          CGO_ENABLED=0 go build -trimpath -o build/control-smoke/artifact-fs ./cmd/artifact-fs
          swiftc -parse-as-library native/App/Models.swift native/App/EngineClient.swift \
            native/Tools/control-smoke.swift -o build/control-smoke/check
          build/control-smoke/check "$PWD/build/control-smoke/artifact-fs"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-${{ matrix.architecture }}
          path: dist/releases/${{ steps.version.outputs.version }}/
          include-hidden-files: true
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12"
          rm -rf "$RUNNER_TEMP/private_keys"
          if [ -f "$RUNNER_TEMP/reporeach-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/reporeach-signing.keychain-db"; fi

  release:
    if: startsWith(github.ref, 'refs/tags/reporeach-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [engine, filesystem, website, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: macos-*
          path: dist/release
          merge-multiple: true
      - name: Publish verified architecture archives
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF#refs/tags/reporeach-v}}"
          case "$version" in *[!A-Za-z0-9.+-]*|"") exit 2 ;; esac
          tag="reporeach-v$version"
          remote_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            tagged_commit="$(git rev-parse "$tag^{commit}")"
            test "$tagged_commit" = "$(git rev-parse HEAD)" || {
              echo "Existing tag points to a different source commit; refusing to publish these artifacts." >&2
              exit 1
            }
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            test -n "$remote_tag" || {
              echo "Existing release has no verifiable source tag; refusing to change it." >&2
              exit 1
            }
            echo "An existing release for this exact source is preserved without changing its artifacts."
            exit 0
          fi
          python3 scripts/release-manifest.py manifest --directory dist/release --version "$version"
          options=()
          case "$version" in *-*) options+=(--prerelease) ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "RepoReach $version" --generate-notes "${options[@]}" \
            dist/release/*.dmg dist/release/*.zip dist/release/SHA256SUMS dist/release/release.json
